# 스킬 폴더를 저장소에 vendoring했거나 gorani 저장소를 체크아웃한 경우 경로를 맞춘다.
name: change-impact

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "migrations/**"
      - "**/schema.sql"
      - "openapi/**"
      - "**/openapi*.yaml"
      - "**/openapi*.yml"
      - "**/openapi*.json"
      - "src/app/**/page.*"
      - "src/pages/**"
      - "src/routes/**"
      - ".env*"
      - "docker-compose*.yml"
      - "k8s/**"
      - "package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "requirements*.txt"
      - "pyproject.toml"
      - "docs/**/*.artifact.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check stale artifacts
        run: |
          # 안정화 후 --fail-on-stale을 추가해 PR을 차단한다.
          python3 skills/gorani-change-impact/scripts/change_impact.py \
            --mode stale \
            --head "${{ github.event.pull_request.head.sha }}" \
            --base "${{ github.event.pull_request.base.sha }}"

      - name: Comment only when something is stale
        if: hashFiles('.gorani/impact/*.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report="$(ls -1 .gorani/impact/*.md | head -n 1)"
          gh pr comment "$PR_NUMBER" --body-file "$report"
