openapi: 3.0.3
info:
  title: Share API
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /shares:
    get:
      operationId: listShares
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
              example:
                - id: s-1
                  title: Trip plan
                  visibility: team
                  ownerEmail: owner@example.com
    post:
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreate'
            example:
              title: Trip plan
              visibility: team
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
  /shares/{id}:
    get:
      operationId: getShare
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '404':
          description: Not found
components:
  schemas:
    Share:
      type: object
      required: [id, title, visibility]
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 200
        visibility:
          type: string
          enum: [private, team]
        ownerEmail:
          type: string
    ShareCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        visibility:
          type: string
          enum: [private, team]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security: []
