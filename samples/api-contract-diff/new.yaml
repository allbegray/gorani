openapi: 3.0.3
info:
  title: Share API
  version: 1.1.0
servers:
  - url: https://api.example.com/v1
paths:
  /shares:
    get:
      operationId: listShares
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
              example:
                - id: s-1
                  title: Trip plan
                  visibility: private
    post:
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreate'
            example:
              title: Trip plan
              visibility: private
              workspaceId: ws-1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
  /shares/{id}:
    get:
      operationId: fetchShare
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
  /shares/{id}/comments:
    get:
      operationId: listShareComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    body:
                      type: string
components:
  schemas:
    Share:
      type: object
      required: [id, title, visibility]
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 120
        visibility:
          type: string
          enum: [private, public]
    ShareCreate:
      type: object
      required: [title, workspaceId]
      properties:
        title:
          type: string
          maxLength: 120
        visibility:
          type: string
          enum: [private, public]
        workspaceId:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
